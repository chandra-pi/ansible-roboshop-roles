- name: app setup
  include_role:
    name: common
    tasks_from: app-setup

- name: nodejs setup
  include_role:
    name: common
    tasks_from: nodejs

- name: systemd setup
  include_role:
    name: common
    tasks_from: systemd.yaml

- name: copy mongodb repo
  ansible.builtin.copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: install mongodb client
  ansible.builtin.dnf:
    name: mongodb-mongosh
    state: present

- name: check products loaded or not
  ansible.builtin.command: mongosh --host mongodb.devaws84s.online --eval 'db.getMongo().getDBNames().indexOf("catalogue")'
  register: catalogue_ouput
  # ignore_errors: true
  # ignore_unreachable: true

- name: print catalogue output
  ansible.builtin.debug:
    msg: "{{ catalogue_ouput }}"
  # ignore_errors: true
  # ignore_unreachable: true

- name: load products
  ansible.builtin.shell: mongosh --host mongodb.devaws84s.online < /app/db/master-data.js
  when: catalogue_ouput.stdout | int < 0
  # ignore_errors: true
  # ignore_unreachable: true

- name: restart catalogue
  ansible.builtin.service:
    name: catalogue
    state: restarted

- name: deployment setup ### It will throw exception once started execution
  tags:
  - deployment
  include_role:
    name: common
    tasks_from: deployment

